name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
      - 'integrate/**'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Backend Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: pip install ruff
      - name: Run Ruff Linting
        run: ruff check backend

  frontend-typecheck:
    name: Frontend Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package.json
      - name: Install Dependencies
        working-directory: frontend
        run: npm install
      - name: Run TypeScript Check
        working-directory: frontend
        run: npm run typecheck

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package.json
      - name: Install Dependencies
        working-directory: frontend
        run: npm install
      - name: Run Production Build
        working-directory: frontend
        run: npm run build

  test-backend:
    name: Backend & ML Integration Tests (PostGIS)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: logistics_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'postgres' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d logistics_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            ml/requirements-ml.txt
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          pip install -r ml/requirements-ml.txt
      - name: Run ML Pipeline Tests
        run: pytest ml/tests/test_pipeline.py -v
      - name: Run Backend Integration Suite (Live PostGIS)
        env:
          DATABASE_URL: "postgresql+psycopg://postgres:${{ secrets.CI_POSTGRES_PASSWORD || 'postgres' }}@localhost:5432/logistics_test"
          REQUIRE_DB: "1"
        run: pytest backend/tests -v
