server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. Because the upstream is a variable, `backend` is resolved at REQUEST time, not at start-up:
  #  - nginx still starts (and serves the SPA) when the backend is down, restarting or not created yet; /api/* then
  #    returns 502 and the UI shows its "Backend unavailable" state with a Retry button.
  #  - nginx picks up a new backend IP after the backend container is recreated (no stale cached address).
  resolver 127.0.0.11 valid=10s ipv6=off;

  # liveness of nginx itself (independent of the backend) - used by the compose healthcheck
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # API is proxied to the FastAPI container so the browser only talks to one origin.
  # With a variable and no URI part, the original request URI (/api/...) is forwarded unchanged.
  location /api/ {
    set $backend_upstream http://backend:8000;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location / { try_files $uri /index.html; }
}
