</style></head><body><div id="app"></div><script>
/* ===== data/ : deterministic synthetic layer (fictional grid coords, no real places) ===== */
const rnd=(s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296})(2026);

const TY=[['Food',420,.2],['Fuel',650,.5],['Water',900,.6],['Medical',130,.15],['Maintenance',160,.1],['Engineering',210,.05],['Clothing',110,.3],['Comms',60,.05],['Spares',140,.1],['Shelter',90,.35]];
const DEP=[{id:'Depot_A',x:12,y:52},{id:'Depot_B',x:40,y:63},{id:'Depot_C',x:84,y:58}];
const BAS=[{id:'Base_01',x:30,y:36,f:.7,pen:0},{id:'Base_02',x:56,y:42,f:.9,pen:2},{id:'Base_03',x:18,y:16,f:1,pen:3},{id:'Base_04',x:48,y:12,f:1.3,pen:5},{id:'Base_05',x:82,y:24,f:1.1,pen:2.8}];
const RT=[['R01','Depot_A','Base_01',62,.2,.3,50],['R02','Depot_A','Base_03',118,.5,.7,35],['R03','Depot_A','Base_04',134,.45,.6,38],['R04','Depot_B','Base_01',74,.25,.35,48],['R05','Depot_B','Base_02',58,.15,.2,55],['R06','Depot_C','Base_02',88,.3,.4,46],['R07','Depot_C','Base_05',96,.55,.8,32],['R08','Depot_B','Base_04',150,.6,.7,34]];
const EL=['Low (<500 m)','Moderate (500–1,500 m)','High (1,500–3,000 m)','Very high (>3,000 m)'],TER={};
[['R01','Foothill road',.3,1],['R02','Forested hills',.65,2],['R03','Mountain pass',.6,2],['R04','Rolling plains',.25,0],['R05','Valley floor',.15,0],['R06','Rocky plateau',.35,1],['R07','High-altitude ridge',.85,3],['R08','Mountain pass',.7,2]].forEach(([id,type,td,el])=>TER[id]={type,td,el,tr:.7*td+.3*el/3});
const VE=[['V001','Depot_A',4000,1],['V002','Depot_A',6000,1],['V003','Depot_A',3500,1],['V004','Depot_B',5500,1],['V005','Depot_B',4500,1],['V006','Depot_C',6500,1],['V007','Depot_C',4000,1],['V008','Depot_B',3500,0]].map(([id,dep,cap,up])=>({id,dep,cap,up}));
const ND=110,NF=30,T0=Date.UTC(2026,5,19,6,0),MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dt=d=>new Date(T0+(d-ND)*864e5),dl=d=>{const x=dt(d);return x.getUTCDate()+' '+MO[x.getUTCMonth()]};
const W=[];for(let d=0;d<ND+NF;d++)W.push(cl(.32+.22*Math.sin(d/8.5)+.12*Math.sin(d/2.7+1)+(d>=112&&d<=117?.35:0)+(rnd()-.5)*.1,0,1));
const wNow=(W[ND]+W[ND+1]+W[ND+2])/3,sf=d=>1+.08*Math.sin(2*Math.PI*d/7),ad=(s,d)=>1+s*.6*W[d];
const H={},M={},ITEM=[];let RECS=0;
/* ===== services/forecasting : de-weathered EWMA level + damped trend, re-weathered with outlook ===== */
BAS.forEach(b=>{H[b.id]={};M[b.id]={};TY.forEach(([t,base,s])=>{const x=[];for(let d=0;d<ND;d++){x.push(Math.round(base*b.f*(1+.0015*d)*ad(s,d)*sf(d)*(1+(rnd()-.5)*.14)));RECS++}
H[b.id][t]=x;const bs=x.map((v,d)=>v/(ad(s,d)*sf(d))),E=[bs[0]],fit=[null];for(let d=1;d<ND;d++){fit.push(E[d-1]*ad(s,d)*sf(d));E.push(.2*bs[d]+.8*E[d-1])}
const m7=a=>sum(a)/a.length,sl=(m7(bs.slice(-7))-m7(bs.slice(-14,-7)))/7*.5,fut=[];for(let k=1;k<=NF;k++)fut.push((E[ND-1]+sl*k)*ad(s,ND+k-1)*sf(ND+k-1));
M[b.id][t]={fit,fut};const f7=m7(fut.slice(0,7)),d0=(b.id=='Base_04'&&t=='Medical')?2.8:Math.max(1.5,3+10*rnd()-b.pen);

/* ===== services/ : inventory + route + risk engines (calc), scenario-aware ===== */
const SL={ok:'NORMAL',wr:'WARNING',cr:'CRITICAL'},RL=r=>r<.3?'LOW':r<.5?'MODERATE':'HIGH',RC=r=>r<.3?'ok':r<.5?'wr':'cr',RK=r=>r<25?['LOW','ok']:r<45?['MODERATE','wr']:r<65?['HIGH','cr']:['SEVERE','cr'];
function calc(p){const w=wNow+p.w*(.9-wNow),dm=s=>(1+p.d)*(1+s*.6*(w-wNow));
const rts=RT.map(([id,a,b,km,rd,_t,sp])=>{const te=TER[id],tr=te.tr,r2=Math.min(1,rd+.5*p.r),wr=w*(.5+.5*tr),v=Math.max(sp*(1-.45*r2)*(1-.35*tr)*(1-.3*wr),8),eta=km/v;return{id,a,b,km,rd:r2,tr,te,sp,v,eta,delay:eta-km/sp,wr,risk:cl(.25*r2+.25*wr+.3*tr+.2*Math.min(1,km/160),0,1)}});
const ve=VE.map(v=>({...v,eff:v.up?Math.round(v.cap*p.v):0})),cap=sum(ve.map(v=>v.eff)),lead={};
BAS.forEach(b=>lead[b.id]=1+Math.min(...rts.filter(r=>r.b==b.id).map(r=>r.eta))/24);
const items=ITEM.map(i=>{const dem=i.f7*dm(i.s),days=i.stock/dem,ld=lead[i.l],st=days<3||days<ld+1?'cr':(days<ld+3||i.stock<i.safety?'wr':'ok');
return{...i,dem,days,ld,st,qty:st=='ok'?0:Math.max(0,Math.round((i.safety+dem*(ld+5)-i.stock)/50)*50),short:Math.max(0,Math.round(dem*14-i.stock)),date:dt(ND+days),sc:dem/i.f7}});
const locs=BAS.map(b=>{const it=items.filter(i=>i.l==b.id),c=it.filter(i=>i.st=='cr').length,n=it.filter(i=>i.st=='wr').length;return{...b,c,n,st:c>=2?'cr':(c>=1||n>=3)?'wr':'ok',min:Math.min(...it.map(i=>i.days)),short:sum(it.map(i=>i.short)),dem:sum(it.map(i=>i.dem))}});
const need=sum(items.map(i=>i.qty)),deficit=Math.max(0,need-cap),N=items.length,crit=items.filter(i=>i.st=='cr').length,warn=items.filter(i=>i.st=='wr').length,ar=sum(rts.map(r=>r.risk))/rts.length;
const risk=Math.round(Math.min(100,100*(2.2*crit/N+.8*warn/N+.3*ar+.2*Math.min(1,deficit/Math.max(need,1)))));
return{p,w,items,locs,rts,ve,cap,need,deficit,crit,warn,ar,risk,short:sum(items.map(i=>i.short)),delay:sum(rts.map(r=>r.delay))/rts.length,avgDays:sum(items.map(i=>i.days))/N,sloc:locs.filter(l=>l.st!='ok').length}}
/* ===== services/recommendation : deterministic rule-based engine ===== */
function rec(R,i){const c=R.rts.filter(r=>r.b==i.l).map(r=>({r,v:R.ve.filter(v=>v.dep==r.a&&v.eff>0)})).filter(c=>c.v.length).sort((x,y)=>(x.r.risk+x.r.eta/24)-(y.r.risk+y.r.eta/24))[0];
if(!c)return{...i,src:'—',veh:'—',rt:'—',reason:'No available vehicle can serve this location; escalate transport allocation.'};
const v=c.v.slice().sort((a,b)=>a.eff-b.eff).find(v=>v.eff>=i.qty)||c.v.slice().sort((a,b)=>b.eff-a.eff)[0],r=c.r;
return{...i,src:r.a,veh:v.id,rt:r.id,reason:`Predicted consumption (${fx(i.dem*14)} units / 14 d) exceeds available inventory (${fx(i.stock)}); cover is ${i.days.toFixed(1)} d against a ${i.ld.toFixed(1)} d replenishment lead time. ${r.a} has ${v.id} (${fx(v.eff)} units) available on ${r.id} (route risk ${RL(r.risk)}, ETA ${r.eta.toFixed(1)} h, ${r.te.type} terrain at ${EL[r.te.el].split(' ')[0].toLowerCase()} elevation)`+(v.eff<i.qty?'; quantity exceeds one sortie, so split the dispatch.':'.')}}
/* ===== UI ===== */
const S={tab:'dash',sel:{k:'loc',id:'Base_04'},fl:'',ft:'',hz:14,f:{l:'',t:'',s:''},inv:null,p:{d:0,w:0,r:0,v:1},sim:null},P0={d:0,w:0,r:0,v:1},BASE=calc(P0);
const tag=(s,t)=>`<span class="tg ${s}">${t||SL[s]}</span>`,kpi=(l,v,s,c='')=>`<div class="kp ${c}"><b>${v}</b><i>${l}</i><u>${s||''}</u></div>`,card=(t,b,x='')=>`<section class="cd ${x}"><h3>${t}</h3>${b}</section>`;
const sel=(fn,o,v,all)=>`<select onchange="${fn}(this.value)"><option value="">${all}</option>${o.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`;
const col=c=>`var(--${c})`,dd=d=>d.getUTCDate()+' '+MO[d.getUTCMonth()];
function chart(sr,n,lab,band){const w=640,h=230,L=46,B=26,T=10,Rr=8;let mx=0;sr.forEach(s=>s.v.forEach(v=>v!=null&&(mx=Math.max(mx,v))));if(band)band.forEach(v=>v&&(mx=Math.max(mx,v[1])));mx=mx*1.08||1;
const X=i=>L+i*(w-L-Rr)/(n-1),Y=v=>T+(h-T-B)*(1-v/mx);let o=`<svg viewBox="0 0 ${w} ${h}" class="ch">`;
for(let k=0;k<=4;k++){const y=T+(h-T-B)*k/4;o+=`<line x1="${L}" x2="${w-Rr}" y1="${y}" y2="${y}" class="gl"/><text x="${L-6}" y="${y+3}" class="ax" text-anchor="end">${fx(mx*(1-k/4))}</text>`}
for(let k=0;k<=5;k++){const i=Math.round(k*(n-1)/5);o+=`<text x="${X(i)}" y="${h-8}" class="ax" text-anchor="middle">${lab(i)}</text>`}
if(band){const ix=band.map((b,i)=>b?i:-1).filter(i=>i>=0);o+=`<polygon fill="#c9a44c" opacity=".16" points="${ix.map(i=>X(i)+','+Y(band[i][1])).join(' ')} ${ix.slice().reverse().map(i=>X(i)+','+Y(band[i][0])).join(' ')}"/>`}
sr.forEach(s=>{let d='',pen=0;s.v.forEach((v,i)=>{if(v==null){pen=0;return}d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);pen=1});o+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="1.8" ${s.d?'stroke-dasharray="5 4"':''}/>`});

function map(R){const Pp={};DEP.concat(BAS).forEach(n=>Pp[n.id]=n);let o='<svg viewBox="0 0 100 70" class="map"><rect width="100" height="70" fill="#0d1614"/><text x="99" y="68.5" text-anchor="end" class="mt">SIMULATED · FICTIONAL</text>';
for(let i=10;i<100;i+=10)o+=`<line x1="${i}" x2="${i}" y1="0" y2="70" class="mg"/>`;for(let i=10;i<70;i+=10)o+=`<line y1="${i}" y2="${i}" x1="0" x2="100" class="mg"/>`;
[0,1,2].forEach(k=>o+=`<ellipse cx="${34+k*20}" cy="${30+k*3}" rx="${26-k*3}" ry="${13-k}" class="ct"/>`);
R.rts.forEach(r=>{const a=Pp[r.a],b=Pp[r.b],on=S.sel.k=='rt'&&S.sel.id==r.id,c=col(RC(r.risk));o+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${c}" stroke-width="${on?1.5:.7}" ${r.rd>.4?'stroke-dasharray="2 1.2"':''} onclick="pick('rt','${r.id}')" style="cursor:pointer"/><text x="${(a.x+b.x)/2+1}" y="${(a.y+b.y)/2-.8}" class="mt">${r.id}</text>`});
DEP.forEach(d=>o+=`<rect x="${d.x-1.6}" y="${d.y-1.6}" width="3.2" height="3.2" fill="#c9a44c"/><text x="${d.x}" y="${d.y+5}" class="ml" text-anchor="middle">${d.id}</text>`);

function ins(i){if(!i)return'<div class="hd">No actionable shortages under current conditions.</div>';const r=i.src?i:rec(BASE,i);

const tbl=(h,rows)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows}</table></div>`;
function dash(R){const cr=R.items.filter(i=>i.st=='cr').sort((a,b)=>a.days-b.days),wr=R.items.filter(i=>i.st=='wr').sort((a,b)=>a.days-b.days),top=cr[0]||wr[0],rk=RK(R.risk),rr=top&&rec(R,top);

if(!ch)y='No feasible route: no vehicle is available at any serving depot.';else if(fe.length==1)y=`${ch.r.id} is the only feasible corridor to ${dest}`+(rs.length>1?' (the other routes have no available vehicle).':' (single-corridor location).');else{const o=fe[1];y=`${ch.r.id} has the lowest combined score (${ch.sc.toFixed(2)} vs ${o.sc.toFixed(2)} for ${o.r.id}): ${ch.r.risk<=o.r.risk?'lower route risk':'higher route risk but shorter ETA'}${ch.r.eta<=o.r.eta?' and shorter ETA.':' despite a longer ETA.'} Terrain risk ${Math.round(ch.r.tr*100)} (${ch.r.te.type}) vs ${Math.round(o.r.tr*100)} (${o.r.te.type}).`}
return card('ROUTE OPTIMIZATION COMPARISON · FEASIBLE ROUTES TO '+dest,tbl(['ROUTE','FROM','KM','ETA H','VEHICLE CAP.','ROAD','TERRAIN','ELEVATION','TERRAIN RISK','WEATHER RISK','ROUTE RISK','COMBINED SCORE','DECISION'],rs.map(x=>`<tr class="${ch&&x.r==ch.r?'s':''}"><td>${x.r.id}</td><td>${x.r.a}</td><td>${x.r.km}</td><td>${x.r.eta.toFixed(1)}</td><td>${fx(x.cp)}</td><td>${RD(x.r.rd)}</td><td>${x.r.te.type}</td><td>${EL[x.r.te.el].split(' ')[0]}</td><td>${Math.round(x.r.tr*100)}</td><td>${RL(x.r.wr)}</td><td>${tag(RC(x.r.risk),RL(x.r.risk))}</td><td>${x.sc.toFixed(2)}</td><td>${!x.ok?'<span class="up">NO VEHICLE</span>':ch&&x.r==ch.r?'<b class="dn">SELECTED</b>':'Alternative'}</td></tr>`).join(''))+`<div class="why"><b>Why selected:</b> ${y} Route risk = 0.25 × road + 0.25 × weather + 0.30 × terrain + 0.20 × distance; terrain also reduces speed and so raises ETA. Combined score = route risk (0–1) + ETA ÷ 24 h, lower is better; only routes with an available vehicle are feasible. This is the same rule the recommendation engine applies.</div>`)}
function health(R){const fin=a=>a.every(Number.isFinite),A=agg('',''),c=conf(A.a,A.f,14),ar=R.items.filter(i=>i.st!='ok');
return[['Data Engine',RECS==ND*BAS.length*TY.length&&BAS.every(b=>TY.every(t=>fin(H[b.id][t[0]]))),`${fx(RECS)} records validated`],['Forecast Engine',ITEM.every(i=>fin(i.fut)),`backtest MAPE ${c.mape.toFixed(1)}% · ${ITEM.length} series`],['Inventory Risk Engine',R.items.length==ITEM.length&&R.items.every(i=>Number.isFinite(i.days)),`${R.items.length} positions scored`],['Route Optimizer',R.rts.every(r=>Number.isFinite(r.eta)),`${R.rts.length} routes evaluated`],['Recommendation Engine',ar.every(i=>rec(R,i).src!='—'),`${ar.length} actions routed`],['Simulation Engine',Number.isFinite(BASE.risk)&&Number.isFinite(R.risk),JSON.stringify(R.p)==JSON.stringify(P0)?'baseline scenario':'scenario active']]}
function extra(R){const pq=prio(R),nl=R.locs.filter(l=>l.st!='ok'),stb=(t,s)=>`<div class="pb"><b>${t}</b><small>${s}</small></div>`,ar='<div class="pa">▼</div>';
return card('SUPPLY PRIORITY QUEUE · DECISION-SUPPORT PRIORITY SCORE',tbl(['RANK','LOCATION','SUPPLY','RISK','PRIORITY SCORE','SHORTAGE HORIZON','REPLEN.'],pq.slice(0,10).map((i,k)=>`<tr class="c" onclick="pick('loc','${i.l}')"><td>${k+1}</td><td>${i.l}</td><td>${i.t}</td><td>${tag(i.st)}</td><td><b>${i.sc}</b> <div class="sb"><i style="width:${i.sc}%"></i></div></td><td>${i.days.toFixed(1)} d · ${dd(i.date)}</td><td>${fx(i.qty)}</td></tr>`).join('')||'<tr><td colspan=7>No at-risk items.</td></tr>')+`<div class="lg">Showing ${Math.min(10,pq.length)} of ${pq.length} at-risk items. Score (0–100) = 100 × (0.45 × urgency + 0.20 × shortfall share + 0.20 × supply-criticality weight + 0.15 × best-route risk); urgency = 1 − days of cover ÷ 10; shortfall = unmet share of 14-day demand. Weights are fixed, documented assumptions of this prototype.</div>`)
+allocCard(R)+iotCard(R)+'<div class="g g2" style="margin-top:12px">'+card('WHY AT RISK · EXPLAINABLE RISK',nl.map(l=>whyBlk(R,l)).join('')||'No locations at warning or critical level.')+'<div style="display:grid;gap:12px;align-content:start">'+card('SYSTEM STATUS',tbl(['ENGINE','STATE','DETAIL'],health(R).map(h=>`<tr><td>${h[0]}</td><td><span class="dot" style="background:${h[1]?'var(--ok)':'var(--cr)'}"></span>${h[1]?'OPERATIONAL':'DEGRADED'}</td><td>${h[2]}</td></tr>`).join('')))+card('DATA COVERAGE','<div class="kv">'+kv('Historical days',ND)+kv('Forward locations',BAS.length)+kv('Supply types',TY.length)+kv('Historical records',fx(RECS))+kv('Depots',DEP.length)+kv('Routes',RT.length)+kv('Vehicles',VE.length)+'</div>')+'</div></div>'
+card('DATA PIPELINE',`<div class="pr">${stb('Consumption',fx(RECS)+' records')}${stb('Inventory',R.items.length+' positions')}${stb('Weather',(ND+NF)+'-day index')}${stb('Transport',VE.length+' vehicles')}${stb('Routes',RT.length+' routes · terrain')}</div>${ar}${stb('Prediction Engine',ITEM.length+' forecasts · '+NF+'-day outlook')}${ar}${stb('Risk Engine',R.crit+' critical · '+R.warn+' warning items')}${ar}${stb('Recommendation Engine',pq.length+' prioritised actions · route selection')}`)}

/* ===== v3: allocation, simulated IoT feed, challenger Random Forest ===== */
function alloc(R){const cap={};R.ve.forEach(v=>cap[v.id]=v.eff);const rows=[];
prio(R).filter(i=>i.qty>0).forEach(i=>{let need=i.qty;const legs=[],rs=R.rts.filter(r=>r.b==i.l).map(r=>({r,sc:r.risk+r.eta/24})).sort((a,b)=>a.sc-b.sc);
for(const x of rs){let vs=R.ve.filter(v=>v.dep==x.r.a&&cap[v.id]>0);while(need>0&&vs.length){const f=vs.filter(v=>cap[v.id]>=need).sort((a,b)=>cap[a.id]-cap[b.id])[0]||vs.slice().sort((a,b)=>cap[b.id]-cap[a.id])[0],q=Math.min(need,cap[f.id]);cap[f.id]-=q;need-=q;legs.push({r:x.r.id,v:f.id,q});vs=vs.filter(v=>cap[v.id]>0)}}
rows.push({...i,need:i.qty,alloc:i.qty-need,unmet:need,legs,sd:Math.max(0,i.safety-i.stock)})});
return{rows,used:sum(rows.map(o=>o.alloc)),unmet:sum(rows.map(o=>o.unmet)),left:sum(Object.values(cap))}}
function allocCard(R){const A=alloc(R);return'<div style="margin-top:12px">'+card('ALLOCATION PLAN','<div class="mono" style="color:var(--ac);margin-bottom:8px">Decision-Support Allocation — Synthetic Scenario</div><div class="g g7" style="margin-bottom:8px">'+kpi('TOTAL NEED',fx(R.need),'units')+kpi('FLEET CAPACITY',fx(R.cap),'units')+kpi('ALLOCATED',fx(A.used),'units','ok')+kpi('UNMET',fx(A.unmet),'units',A.unmet?'cr':'ok')+kpi('CAPACITY LEFT',fx(A.left),'units')+'</div>'+tbl(['RANK','LOCATION','SUPPLY','SCORE','SAFETY DEFICIT','LEAD TIME','NEED','ALLOCATED','UNMET','DISPATCH (VEHICLE VIA ROUTE)','STATUS'],A.rows.map((o,k)=>`<tr class="c" onclick="pick('loc','${o.l}')"><td>${k+1}</td><td>${o.l}</td><td>${o.t}</td><td>${o.sc}</td><td>${fx(o.sd)}</td><td>${o.ld.toFixed(1)} d</td><td>${fx(o.need)}</td><td>${fx(o.alloc)}</td><td>${fx(o.unmet)}</td><td>${o.legs.map(g=>`${g.v} via ${g.r}: ${fx(g.q)}`).join('; ')||'—'}</td><td>${o.unmet==0?tag('ok','FULL'):o.alloc?tag('wr','PARTIAL'):tag('cr','NOT SERVED')}</td></tr>`).join('')||'<tr><td colspan=11>No allocation required.</td></tr>')+`<div class="lg">Order = Decision-Support Priority Score (shortage horizon, shortfall, supply criticality, route risk). NEED = safety-stock deficit + predicted demand over lead time + 5-day buffer. Only routes whose depot has an available vehicle are feasible; routes are tried in combined-score order and vehicles are loaded within effective capacity (smallest sufficient vehicle first). Depot stock is assumed sufficient in this synthetic scenario, so transport capacity is the binding constraint. Unmet (${fx(A.unmet)}) can exceed the pooled fleet deficit (${fx(R.deficit)}) because each vehicle can only serve routes from its own depot. The AI Logistics Insight is a stand-alone recommendation per item that assumes full vehicle availability; this plan resolves vehicle contention across all items, so the assigned vehicle can differ.</div>`)+'</div>'}
function iotCard(R){const A=alloc(R),L=[];A.rows.forEach(o=>o.legs.forEach(g=>L.push({o,g})));const ST=['IN TRANSIT','LOADING','STAGED'];
return'<div style="margin-top:12px">'+card('SIMULATED IoT INVENTORY FEED · SYNTHETIC SENSOR DATA',tbl(['CONTAINER ID','SOURCE','DESTINATION','SUPPLY','QUANTITY','STATUS','SIMULATED LAST UPDATE'],L.slice(0,8).map((x,k)=>`<tr><td class="mono">CTN-${4000+k*37+(+x.o.l.slice(-1))*11}</td><td>${R.rts.find(r=>r.id==x.g.r).a}</td><td>${x.o.l}</td><td>${x.o.t}</td><td>${fx(x.g.q)}</td><td><span class="tg">${ST[k%3]}</span></td><td class="mono">${new Date(T0-(k*7+3)*6e4).toISOString().slice(11,16)}Z (sim)</td></tr>`).join('')||'<tr><td colspan=7>No containers in the feed.</td></tr>')+'<div class="lg">Simulated sensor data only. No hardware or live telemetry is connected; container IDs, statuses and timestamps are generated from the allocation plan and the simulation clock.</div>')+'</div>'}
let RFC;const rfm=()=>{if(RFC!==undefined)return RFC;try{RFC=trainRF()}catch(e){RFC=null}return RFC};
function trainRF(){const X=[],y=[],Xh=[],yh=[],mt=[],NT=20,DP=6,r=(q=>()=>{q|=0;q=q+0x6D2B79F5|0;let t=Math.imul(q^q>>>15,1|q);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296})(7);
BAS.forEach(b=>TY.forEach(([t,,sn])=>{const h=H[b.id][t],mu=sum(h.slice(0,90))/90,ft=M[b.id][t].fit;for(let d=8;d<ND;d++){const x=[h[d-1]/mu,sum(h.slice(d-7,d))/7/mu,W[d],W[d-1],d%7,sn];if(d<90){X.push(x);y.push(h[d]/mu)}else{Xh.push(x);yh.push(h[d]);mt.push({mu,f:ft[d]})}}}));
const sse=a=>{const m=sum(a.map(i=>y[i]))/a.length;return sum(a.map(i=>(y[i]-m)**2))};
const build=(ix,d)=>{const m=sum(ix.map(i=>y[i]))/ix.length;if(d==0||ix.length<16)return{v:m};let bs=null;for(let k=0;k<3;k++){const f=Math.floor(r()*6);for(let q=0;q<8;q++){const th=X[ix[Math.floor(r()*ix.length)]][f],L=[],Rr=[];ix.forEach(i=>(X[i][f]<=th?L:Rr).push(i));if(L.length<6||Rr.length<6)continue;const e=sse(L)+sse(Rr);if(!bs||e<bs.e)bs={e,f,th,L,Rr}}}return bs?{f:bs.f,th:bs.th,l:build(bs.L,d-1),r:build(bs.Rr,d-1)}:{v:m}};
const T=[];for(let k=0;k<NT;k++)T.push(build(Array.from({length:X.length},()=>Math.floor(r()*X.length)),DP));
const pt=(n,x)=>n.v!==undefined?n.v:pt(x[n.f]<=n.th?n.l:n.r,x),pr=x=>sum(T.map(t=>pt(t,x)))/NT;let er=0,es=0;
Xh.forEach((x,i)=>{er+=Math.abs(pr(x)*mt[i].mu-yh[i])/yh[i];es+=Math.abs(mt[i].f-yh[i])/yh[i]});
return{nt:NT,n:X.length,nh:Xh.length,rf:er/Xh.length*100,st:es/Xh.length*100}}
function lab(){const g=i=>+document.getElementById(i).value;const t=(i,x)=>{const e=document.getElementById(i+'l');if(e)e.textContent=x};t('sd','+'+g('sd')+'%');t('sw',wl(g('sw')/100));t('sr',rl(g('sr')/100));t('sv',(100-g('sv'))+'%')}
function run(){const g=i=>+document.getElementById(i).value,p={d:g('sd')/100,w:g('sw')/100,r:g('sr')/100,v:1-g('sv')/100};S.sim={p,res:calc(p)};draw()}
function applyS(){if(!S.sim)run();S.p=S.sim.p;go('dash')}function resetS(){S.p={...P0};S.sim=null;draw()}
function pick(k,id){S.sel={k,id};S.tab='gis';draw()}function go(t){S.tab=t;draw();scrollTo(0,0)}
function setFl(v){S.fl=v;draw()}function setFt(v){S.ft=v;draw()}function setF(k,v){S.f[k]=v;draw()}
['l','t','s'].forEach(k=>window['setF.'+k]=v=>setF(k,v));
function draw(){const R=calc(S.p),sc=JSON.stringify(S.p)!=JSON.stringify(P0),NV=[['dash','Command Dashboard'],['fc','Demand Forecast'],['gis','GIS Logistics'],['inv','Inventory'],['sim','What-If Simulation']];
const v={dash:()=>dash(R),fc:fcs,gis:()=>gis(R),inv:()=>inv(R),sim}[S.tab]();
document.getElementById('app').innerHTML=`<div id="shell"><aside><h1>PREDICTIVE LOGISTICS<br>DECISION SUPPORT</h1><div class="nav"><small>MODULES</small>${NV.map(n=>`<button class="${S.tab==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}<small>DATA</small><div style="padding:0 8px;color:var(--mu);font-size:11px">Synthetic / fictional.<br>No real operational data.</div></div></aside><main><div class="top"><span><span class="dot"></span><b>ENGINE NOMINAL</b></span><span>SIM TIME <b id="clk"></b></span><span>DATA <b>SYNTHETIC</b></span><span>FORECAST <b>${fx(RECS)} recs</b></span><span class="pill" onclick="go('dash')">▲ ${R.crit} CRITICAL</span></div>${sc?`<div class="ban">SCENARIO ACTIVE — demand +${Math.round(S.p.d*100)}% · weather ${wl(S.p.w)} · road ${rl(S.p.r)} · fleet ${Math.round(S.p.v*100)}% <button class="b" onclick="resetS()">Clear</button></div>`:''}<div id="view">${v}</div><div class="disc"><b>Decision Support Only</b> — Recommendations are generated from simulated data. Final logistics decisions remain with authorized personnel.</div></main></div>`;
if(S.tab=='sim')lab();clk()}
function clk(){const e=document.getElementById('clk');if(e)e.textContent=new Date(T0+(Date.now()-B0)*60).toISOString().slice(0,16).replace('T',' ')+'Z'}
const B0=Date.now();draw();setInterval(clk,1000);
</script></body></html>
